name: Automated Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sequential_edge:
        description: 'Executar Edge sequencialmente para diagnóstico'
        required: false
        type: boolean
        default: false

jobs:
  pull-request-tests:
    if: github.event_name == 'pull_request'
    name: ${{ matrix.suite }} - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            browser: chrome
          - suite: smoke
            browser: firefox
          - suite: smoke
            browser: edge
          - suite: regression
            browser: chrome

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Execute ${{ matrix.suite }} tests - ${{ matrix.browser }}
        run: >
          mvn clean verify
          -Dgroups=${{ matrix.suite }}
          -Dbrowser=${{ matrix.browser }}
          -Dquality.gate.enforce=true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.suite }}-${{ matrix.browser }}
          path: |
            target/reports/surefire.html
            target/surefire-reports/
          if-no-files-found: warn

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots-${{ matrix.suite }}-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: ignore

  regression-tests:
    if: github.event_name != 'pull_request'
    name: regression - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chrome
          - firefox
          - edge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Execute regression tests - ${{ matrix.browser }}
        env:
          SEQUENTIAL_EDGE: ${{ github.event_name == 'workflow_dispatch' && inputs.sequential_edge && matrix.browser == 'edge' }}
        run: |
          EXTRA_ARGS=""
          if [ "$SEQUENTIAL_EDGE" = "true" ]; then
            EXTRA_ARGS="-Djunit.jupiter.execution.parallel.enabled=false"
          fi

          mvn clean verify \
            -Dgroups=regression \
            -Dbrowser=${{ matrix.browser }} \
            -Dquality.gate.enforce=true \
            $EXTRA_ARGS

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-${{ matrix.browser }}
          path: |
            target/reports/surefire.html
            target/surefire-reports/
          if-no-files-found: warn

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-failure-screenshots-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: ignore
